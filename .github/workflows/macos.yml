name: unittests-macos

on:
  pull_request:
    branches:
      - main
      - "[0-9].[0-9]"
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
  push:
    branches:
      - main
      - "[0-9].[0-9]"
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
  workflow_dispatch:

concurrency:
  group: unittests-macos-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cmake-tests-macos:
    runs-on: macos-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    # The runner image links Homebrew openssl@4 as the default OpenSSL since
    # 2026-10-13; gRPC v1.70.1 does not build against OpenSSL 4. openssl@3 stays
    # installed on the image. https://github.com/actions/runner-images/issues/14856
    - name: Pin OpenSSL 3
      run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

    - name: Build Code
      run: ./build.sh
