syntax = "proto3";

package valkey_search.coordinator;

import "google/protobuf/any.proto";

service Coordinator {
  // Get the current schema metadata.
  rpc GetGlobalMetadata(GetGlobalMetadataRequest)
      returns (GetGlobalMetadataResponse) {}
  // Search the index partition for documents.
  rpc SearchIndexPartition(SearchIndexPartitionRequest)
      returns (SearchIndexPartitionResponse) {}
  // Multi-arm search: dispatch N independent searches in one round-trip.
  // Used by FT.HYBRID. The server-side handler validates that all sub_requests
  // agree on db_num, index_schema_name, index_fingerprint_version,
  // slot_fingerprint, and timeout_ms; treats sub_requests[0] as authoritative
  // for the shared consistency check.
  rpc MultiSearchIndexPartition(MultiSearchIndexPartitionRequest)
      returns (MultiSearchIndexPartitionResponse) {}
  // Get index info across cluster
  rpc InfoIndexPartition(InfoIndexPartitionRequest)
      returns (InfoIndexPartitionResponse) {}
}

message LimitParameter {
  uint64 first_index = 1;
  uint64 number = 2;
}

message TagPredicate {
  string attribute_alias = 1;
  string raw_tag_string = 2;
}

message NumericPredicate {
  string attribute_alias = 1;
  double start = 2;
  bool is_inclusive_start = 3;
  double end = 4;
  bool is_inclusive_end = 5;
}

message TermPredicate {
  uint64 field_mask = 1;
  string content = 2;
  bool exact = 3;
}

message PrefixPredicate {
  uint64 field_mask = 1;
  string content = 2;
}

message SuffixPredicate {
  uint64 field_mask = 1;
  string content = 2;
}

message InfixPredicate {
  uint64 field_mask = 1;
  string content = 2;
}

message FuzzyPredicate {
  uint64 field_mask = 1;
  string content = 2;
  uint32 distance = 3;
}

message AndPredicate {
  repeated Predicate children = 1;
  optional uint32 slop = 2;
  bool inorder = 3;
}

message OrPredicate {
  repeated Predicate children = 1;
}

message NegatePredicate {
  Predicate predicate = 1;
}

message Predicate {
  oneof predicate {
    TagPredicate tag = 1;
    NumericPredicate numeric = 2;
    AndPredicate and = 3;
    OrPredicate or = 4;
    NegatePredicate negate = 5;
    TermPredicate term = 6;
    PrefixPredicate prefix = 7;
    SuffixPredicate suffix = 8;
    InfixPredicate infix = 9;
    FuzzyPredicate fuzzy = 10;
  }
  // Query-modifier weight ($weight:N). Defaults to 1.0 when unset so scoring on
  // the shard matches standalone. Applies to leaf and composed predicates.
  optional float weight = 11;
}

message ReturnParameter {
  string identifier = 1;
  string alias = 2;
}

enum SortOrder {
  SORT_ORDER_ASCENDING = 0;
  SORT_ORDER_DESCENDING = 1;
}

message SortByParameter {
  string field = 1;
  SortOrder order = 2;
}

message IndexFingerprintVersion {
  uint64 fingerprint = 1;
  uint32 version = 2;
}

enum Scorer {
  SCORER_BM25STD = 0;
  SCORER_TFIDF = 1;
}

message SearchIndexPartitionRequest {
  uint32 db_num = 1;
  string index_schema_name = 2;
  string attribute_alias = 3;
  optional string score_as = 4;
  bytes query = 5;
  uint32 dialect = 6;
  uint32 k = 7;
  uint64 ef = 8;
  LimitParameter limit = 9;
  uint64 timeout_ms = 10;
  bool no_content = 11;
  optional Predicate root_filter_predicate = 12;
  repeated ReturnParameter return_parameters = 13;
  bool enable_partial_results = 14;
  bool enable_consistency = 15;
  IndexFingerprintVersion index_fingerprint_version = 16;
  uint64 slot_fingerprint = 17;
  uint64 query_operations = 18;
  optional SortByParameter sortby = 19;
  Scorer scorer = 20;
  // Set for a VSIM arm carrying a FILTER: the filter decides membership, never
  // the score, so the shard must keep the KNN distance as Neighbor.score even
  // when the filter holds a text predicate. Not derivable from the rewritten
  // query string -- `(<filter>)=>[KNN ...]` is indistinguishable from a
  // `text=>[KNN ...]` hybrid query -- so it has to cross the wire.
  bool vector_score_only = 21;
  // Set when the query was the bare match-all (`*`). The match-all form leaves
  // root_filter_predicate unset and query_operations at kNone, so without this
  // flag the shard cannot tell match-all from an absent filter and would
  // evaluate a null predicate. The shard never re-parses the query string, so
  // it has to cross the wire.
  bool is_match_all = 22;
}

message NeighborEntry {
  string key = 1;
  float distance = 2;  // Legacy float representation.
  repeated AttributeContentEntry attribute_contents = 3;
  float score = 4;  // Legacy float representation.
  optional double distance_fp64 = 5;
  optional double score_fp64 = 6;
}

message SearchIndexPartitionResponse {
  repeated NeighborEntry neighbors = 1;
  uint64 total_count = 2;
}

message AttributeContentEntry {
  string identifier = 1;
  bytes content = 2;
}

// Per-arm wrapper for the multi-arm response, carrying the arm's
// SearchIndexPartitionResponse alongside a record of how that arm fared.
//
// The RPC's own gRPC status is authoritative, NOT these fields. A shard must
// answer every arm or none: a shard that reported one arm's failure while
// returning the other arm's results would contribute one-sided documents to
// the coordinator's fusion, and their fused score would be wrong with nothing
// in the reply to say so. MultiSearchIndexPartition therefore finishes the
// reactor with the first non-OK arm status, and because the RPC is unary a
// non-OK finish means this message is never delivered at all. So a delivered
// MultiSearchSubResponse always carries grpc_code == 0; the fields exist to
// record WHICH arm failed for diagnostics, not to keep a failed arm's RPC
// alive. The client's per-arm demux is defensive only.
message MultiSearchSubResponse {
  SearchIndexPartitionResponse response = 1;
  uint32 grpc_code = 2;       // grpc::StatusCode encoded as int; 0 = OK
  string error_message = 3;
}

message MultiSearchIndexPartitionRequest {
  // Each sub_request is a complete, stand-alone single-arm request. Shared
  // fields (db_num, index_schema_name, index_fingerprint_version,
  // slot_fingerprint, timeout_ms) are duplicated across arms. The handler
  // validates that sub_requests[1..N-1] match sub_requests[0] on these
  // fields; sub_requests[0] is then treated as authoritative for the shared
  // consistency check.
  repeated SearchIndexPartitionRequest sub_requests = 1;
}

message MultiSearchIndexPartitionResponse {
  repeated MultiSearchSubResponse sub_responses = 1;
}

message GlobalMetadataVersionHeader {
  uint64 top_level_fingerprint = 1;
  uint32 top_level_version = 2;
  uint32 top_level_min_version = 3;
}

message GlobalMetadata {
  GlobalMetadataVersionHeader version_header = 1;
  // Nested map. Outer map is namespace, inner map is ID to entry.
  map<string, GlobalMetadataEntryMap> type_namespace_map = 2;
}

// GlobalMetadataEntryMap is a wrapper around a map from ID to metadata entry.
message GlobalMetadataEntryMap {
  map<string, GlobalMetadataEntry> entries = 1;
}

message GlobalMetadataEntry {
  uint32 version = 1;
  uint64 fingerprint = 2;
  uint32 encoding_version = 3;
  optional google.protobuf.Any content = 4;
  uint32 min_version = 5;
}

message GetGlobalMetadataRequest {}
message GetGlobalMetadataResponse {
  GlobalMetadata metadata = 1;
}

message InfoIndexPartitionRequest {
  uint32 db_num = 1;
  string index_name = 2;
  bool require_consistency = 3;
  IndexFingerprintVersion index_fingerprint_version = 4;
  uint64 slot_fingerprint = 5;
}

enum FanoutErrorType {
  OK = 0;
  INDEX_NAME_ERROR = 1;
  INCONSISTENT_STATE_ERROR = 2;
  COMMUNICATION_ERROR = 3;
}

message AttributeInfo {
  string identifier = 1;
  string alias = 2;
  uint64 user_indexed_memory = 3;
  uint64 num_records = 4;
}

message InfoIndexPartitionResponse {
  bool exists = 1;
  string index_name = 2;
  uint64 num_docs = 3;
  uint64 num_records = 4;
  uint64 hash_indexing_failures = 5;
  uint64 backfill_scanned_count = 6;
  uint64 backfill_db_size = 7;
  uint64 backfill_inqueue_tasks = 8;
  float backfill_complete_percent = 9;
  bool backfill_in_progress = 10;
  uint64 mutation_queue_size = 11;
  uint64 recent_mutations_queue_delay = 12;
  string state = 13;
  string error = 14;
  optional IndexFingerprintVersion index_fingerprint_version = 15;
  FanoutErrorType error_type = 16;
  uint32 db_num = 17;
  repeated AttributeInfo attributes = 18;
}
